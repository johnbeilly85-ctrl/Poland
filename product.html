<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product - PolandShop</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 15px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

header a {
  color: white;
  text-decoration: none;
}

.container {
  max-width: 1000px;
  margin: 25px auto;
  padding: 0 15px;
}

.product {
  background: white;
  border-radius: 12px;
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
}

.gallery-main {
  width: 100%;
  height: 430px;
  object-fit: contain;
  background: #f1f1f1;
  border-radius: 10px;
}

.thumbnails {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  overflow-x: auto;
}

.thumbnail {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border: 2px solid transparent;
  border-radius: 6px;
  cursor: pointer;
}

.thumbnail.active {
  border-color: #111;
}

h1 {
  font-size: 30px;
  margin-bottom: 15px;
}

.category {
  color: #666;
  margin-bottom: 12px;
}

.description {
  line-height: 1.6;
  margin-bottom: 20px;
  white-space: pre-wrap;
}

.price {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 8px;
}

.old-price {
  color: #888;
  text-decoration: line-through;
  font-size: 17px;
  margin-left: 8px;
}

.stock {
  margin: 12px 0;
  color: #555;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
}

.quantity button {
  width: 40px;
  height: 40px;
  border: none;
  background: #ddd;
  border-radius: 6px;
  font-size: 20px;
  cursor: pointer;
}

.quantity input {
  width: 70px;
  height: 40px;
  text-align: center;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

.buttons {
  display: flex;
  gap: 10px;
}

.buttons button,
.buttons a {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

.add {
  background: #111;
  color: white;
}

.buy {
  background: #e11d48;
  color: white;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;
  display: none;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.loading,
.not-found {
  background: white;
  padding: 40px;
  border-radius: 10px;
  text-align: center;
}

@media (max-width: 700px) {
  .product {
    grid-template-columns: 1fr;
  }

  .gallery-main {
    height: 320px;
  }

  h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">PolandShop</div>

    <a href="cart.html">
      Cart (<span id="cartCount">0</span>)
    </a>
  </div>
</header>

<main class="container">

  <div id="content" class="loading">
    Loading product...
  </div>

</main>

<script>

const CART_KEY = "polandShopCart";

const params =
  new URLSearchParams(
    window.location.search
  );

const productId =
  params.get("id");

let product = null;
let quantity = 1;

function $(id) {
  return document.getElementById(id);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(character) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character];
      }
    );
}

function money(value) {
  return "PLN " +
    Number(value).toFixed(2);
}

function getCart() {
  try {
    return JSON.parse(
      localStorage.getItem(
        CART_KEY
      )
    ) || [];
  } catch {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );
}

function updateCartCount() {

  const cart = getCart();

  const count =
    cart.reduce(
      function(total, item) {
        return total +
          Number(item.quantity || 0);
      },
      0
    );

  $("cartCount").textContent =
    count;
}

function getPrice(product) {

  const normal =
    Number(product.price);

  const discount =
    Number(product.discountPrice);

  if (
    Number.isFinite(discount) &&
    discount > 0 &&
    discount < normal
  ) {
    return discount;
  }

  return normal;
}

function showMessage(
  message,
  type
) {

  const box =
    $("message");

  box.textContent =
    message;

  box.className =
    "message " + type;

  box.style.display =
    "block";
}

function changeQuantity(amount) {

  if (!product) return;

  quantity += amount;

  const stock =
    Number(product.stock);

  if (quantity < 1) {
    quantity = 1;
  }

  if (quantity > stock) {
    quantity = stock;
  }

  $("quantity").value =
    quantity;
}

function setQuantity(value) {

  if (!product) return;

  const stock =
    Number(product.stock);

  let newQuantity =
    Number(value);

  if (
    !Number.isInteger(
      newQuantity
    )
  ) {
    newQuantity = 1;
  }

  newQuantity =
    Math.max(
      1,
      Math.min(
        stock,
        newQuantity
      )
    );

  quantity =
    newQuantity;

  $("quantity").value =
    quantity;
}

function addToCart(
  goToCheckout = false
) {

  if (!product) return;

  const stock =
    Number(product.stock);

  if (stock < 1) {
    showMessage(
      "This product is out of stock.",
      "error"
    );
    return;
  }

  const cart =
    getCart();

  const existing =
    cart.find(
      function(item) {
        return String(
          item.productId
        ) === String(
          product._id
        );
      }
    );

  const existingQuantity =
    existing
      ? Number(existing.quantity)
      : 0;

  if (
    existingQuantity +
    quantity >
    stock
  ) {

    showMessage(
      `Only ${stock} item(s) are available.`,
      "error"
    );

    return;
  }

  const price =
    getPrice(product);

  if (existing) {

    existing.quantity =
      existingQuantity +
      quantity;

    existing.price =
      price;

    existing.name =
      product.name;

    existing.image =
      product.images?.[0] || "";

  } else {

    cart.push({
      productId:
        String(product._id),

      name:
        product.name,

      price,

      image:
        product.images?.[0] || "",

      quantity
    });

  }

  saveCart(cart);

  updateCartCount();

  if (goToCheckout) {
    window.location.href =
      "checkout.html";
    return;
  }

  showMessage(
    "Product added to cart.",
    "success"
  );
}

function renderProduct() {

  const price =
    getPrice(product);

  const images =
    Array.isArray(
      product.images
    )
      ? product.images
      : [];

  const mainImage =
    images[0] ||
    "https://via.placeholder.com/600x500?text=PolandShop";

  $("content").className =
    "product";

  $("content").innerHTML = `

    <section>

      <img
        id="mainImage"
        class="gallery-main"
        src="${escapeHtml(mainImage)}"
        alt="${escapeHtml(product.name)}"
      >

      <div class="thumbnails">

        ${
          images.length
            ? images.map(
                function(image, index) {
                  return `
                    <img
                      class="thumbnail ${
                        index === 0
                          ? "active"
                          : ""
                      }"
                      src="${escapeHtml(image)}"
                      data-image="${escapeHtml(image)}"
                      alt=""
                    >
                  `;
                }
              ).join("")
            : ""
        }

      </div>

    </section>

    <section>

      <div class="category">
        ${escapeHtml(
          product.category || "Other"
        )}
      </div>

      <h1>
        ${escapeHtml(product.name)}
      </h1>

      <div class="price">

        ${money(price)}

        ${
          product.discountPrice &&
          product.discountPrice <
            product.price
            ? `
              <span class="old-price">
                ${money(product.price)}
              </span>
            `
            : ""
        }

      </div>

      <div class="stock">

        ${
          Number(product.stock) > 0
            ? `${product.stock} item(s) available`
            : "Out of stock"
        }

      </div>

      <div class="description">
        ${escapeHtml(
          product.description ||
          "No description available."
        )}
      </div>

      ${
        Number(product.stock) > 0
          ? `
            <div class="quantity">

              <button id="minus">
                −
              </button>

              <input
                id="quantity"
                type="number"
                min="1"
                max="${Number(product.stock)}"
                value="1"
              >

              <button id="plus">
                +
              </button>

            </div>

            <div class="buttons">

              <button
                id="addButton"
                class="add"
              >
                Add to Cart
              </button>

              <button
                id="buyButton"
                class="buy"
              >
                Buy Now
              </button>

            </div>
          `
          : `
            <div class="buttons">
              <button
                class="add"
                disabled
              >
                Out of Stock
              </button>
            </div>
          `
      }

      <div
        id="message"
        class="message"
      ></div>

    </section>
  `;

  document
    .querySelectorAll(".thumbnail")
    .forEach(
      function(thumbnail) {

        thumbnail.onclick =
          function() {

            $("mainImage").src =
              thumbnail.dataset.image;

            document
              .querySelectorAll(
                ".thumbnail"
              )
              .forEach(
                img =>
                  img.classList.remove(
                    "active"
                  )
              );

            thumbnail.classList.add(
              "active"
            );
          };
      }
    );

  if (
    Number(product.stock) > 0
  ) {

    $("minus").onclick =
      function() {
        changeQuantity(-1);
      };

    $("plus").onclick =
      function() {
        changeQuantity(1);
      };

    $("quantity").onchange =
      function() {
        setQuantity(
          $("quantity").value
        );
      };

    $("addButton").onclick =
      function() {
        addToCart(false);
      };

    $("buyButton").onclick =
      function() {
        addToCart(true);
      };
  }
}

async function loadProduct() {

  if (!productId) {

    $("content").className =
      "not-found";

    $("content").innerHTML =
      "Product ID is missing.";

    return;
  }

  try {

    const response =
      await fetch(
        "/api/products/" +
        encodeURIComponent(
          productId
        )
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.message ||
        "Product not found."
      );
    }

    product = data;

    renderProduct();

  } catch (error) {

    $("content").className =
      "not-found";

    $("content").innerHTML =
      escapeHtml(
        error.message
      );
  }
}

updateCartCount();

loadProduct();

</script>

</body>
</html>
