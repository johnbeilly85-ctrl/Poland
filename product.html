<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Product - PolandShop</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar {
      background: #d50000;
      color: white;
      text-align: center;
      padding: 7px;
      font-size: 13px;
    }

    .header-main {
      max-width: 1200px;
      margin: auto;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      color: #d50000;
    }

    .logo span {
      color: #222;
    }

    .cart-button {
      text-decoration: none;
      color: #222;
      font-weight: bold;
    }

    .cart-count {
      background: #d50000;
      color: white;
      padding: 3px 7px;
      border-radius: 20px;
      font-size: 12px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #d50000;
      text-decoration: none;
      font-weight: bold;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      padding: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .main-image {
      width: 100%;
      height: 450px;
      object-fit: contain;
      background: #f3f3f3;
      border-radius: 8px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .gallery img {
      width: 100%;
      height: 75px;
      object-fit: cover;
      border: 2px solid transparent;
      border-radius: 5px;
      cursor: pointer;
    }

    .gallery img.active {
      border-color: #d50000;
    }

    .category {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .description {
      color: #555;
      line-height: 1.7;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .price {
      font-size: 29px;
      font-weight: bold;
      color: #d50000;
    }

    .old-price {
      color: #888;
      text-decoration: line-through;
      margin-left: 8px;
      font-size: 16px;
    }

    .stock {
      margin-top: 15px;
      font-size: 14px;
    }

    .in-stock {
      color: #188038;
      font-weight: bold;
    }

    .out-stock {
      color: #d50000;
      font-weight: bold;
    }

    .quantity-box {
      margin-top: 20px;
    }

    .quantity-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .quantity-controls {
      display: flex;
      width: 140px;
    }

    .quantity-controls button {
      width: 40px;
      border: 1px solid #ccc;
      background: #eee;
      font-size: 20px;
      cursor: pointer;
    }

    .quantity-controls input {
      width: 60px;
      text-align: center;
      border: 1px solid #ccc;
      border-left: none;
      border-right: none;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .buttons button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .cart-btn {
      background: #eee;
      color: #222;
    }

    .buy-btn {
      background: #d50000;
      color: white;
    }

    .buttons button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .loading,
    .error {
      background: white;
      padding: 50px;
      text-align: center;
      border-radius: 10px;
    }

    .error h2 {
      color: #d50000;
      margin-bottom: 10px;
    }

    footer {
      margin-top: 50px;
      background: #222;
      color: white;
      text-align: center;
      padding: 25px;
    }

    footer p {
      color: #bbb;
      font-size: 14px;
    }

    @media (max-width: 750px) {

      .product-card {
        grid-template-columns: 1fr;
        padding: 18px;
        gap: 20px;
      }

      .main-image {
        height: 330px;
      }

      h1 {
        font-size: 25px;
      }

      .buttons {
        flex-direction: column;
      }

    }
  </style></head><body><header>  <div class="topbar">
    Fast delivery across Poland • Prices shown in PLN
  </div>  <div class="header-main"><div class="logo">
  Poland<span>Shop</span>
</div>

<a href="cart.html" class="cart-button">
  🛒 Cart
  <span id="cartCount" class="cart-count">0</span>
</a>

  </div></header><div class="container">  <a href="index.html" class="back-link">
    ← Back to Store
  </a>  <div id="content"><div class="loading">
  Loading product...
</div>

  </div></div><footer>  <p>
    © 2026 PolandShop. All rights reserved.
  </p></footer><script>

  let product = null;

  // ==========================================
  // GET PRODUCT ID
  // ==========================================

  const params = new URLSearchParams(
    window.location.search
  );

  const productId = params.get("id");


  // ==========================================
  // LOAD PRODUCT
  // ==========================================

  async function loadProduct() {

    const content =
      document.getElementById("content");

    if (!productId) {

      content.innerHTML = `
        <div class="error">
          <h2>Product Not Found</h2>
          <p>No product ID was provided.</p>
        </div>
      `;

      return;
    }

    try {

      const response = await fetch(
        "/api/products/" +
        encodeURIComponent(productId)
      );

      const data = await response.json();

      if (!response.ok) {

        throw new Error(
          data.message ||
          "Unable to load product."
        );
      }

      product = data;

      displayProduct(product);

    } catch (error) {

      console.error(error);

      content.innerHTML = `
        <div class="error">
          <h2>Unable to Load Product</h2>
          <p>${escapeHtml(error.message)}</p>
          <br>
          <a href="index.html">
            Return to store
          </a>
        </div>
      `;

    }

  }


  // ==========================================
  // DISPLAY PRODUCT
  // ==========================================

  function displayProduct(product) {

    const content =
      document.getElementById("content");

    const images =
      product.images &&
      product.images.length
        ? product.images
        : [
            "https://via.placeholder.com/700x500?text=Product"
          ];

    const currentPrice =
      Number(
        product.discountPrice ??
        product.price ??
        0
      );

    const hasDiscount =
      product.discountPrice !== null &&
      product.discountPrice !== undefined &&
      Number(product.discountPrice) <
      Number(product.price);

    const oldPrice =
      hasDiscount
        ? `
          <span class="old-price">
            ${Number(product.price).toFixed(2)} PLN
          </span>
        `
        : "";

    const stock =
      Number(product.stock || 0);

    content.innerHTML = `

      <div class="product-card">

        <div>

          <img
            id="mainImage"
            class="main-image"
            src="${escapeHtml(images[0])}"
            alt="${escapeHtml(product.name)}"
            onerror="this.src='https://via.placeholder.com/700x500?text=Product'"
          >

          <div class="gallery">

            ${images.map((image, index) => `

              <img
                src="${escapeHtml(image)}"
                class="${index === 0 ? "active" : ""}"
                onclick="changeImage('${escapeJs(image)}', this)"
                alt="Product image"
                onerror="this.style.display='none'"
              >

            `).join("")}

          </div>

        </div>


        <div>

          <div class="category">
            ${escapeHtml(product.category || "Other")}
          </div>

          <h1>
            ${escapeHtml(product.name)}
          </h1>

          <div class="description">
            ${escapeHtml(
              product.description ||
              "No description available."
            )}
          </div>

          <div>

            <span class="price">
              ${currentPrice.toFixed(2)} PLN
            </span>

            ${oldPrice}

          </div>


          <div class="stock">

            ${
              stock > 0
                ? `
                  <span class="in-stock">
                    ✓ In Stock
                  </span>
                  <br>
                  ${stock} available
                `
                : `
                  <span class="out-stock">
                    Out of Stock
                  </span>
                `
            }

          </div>


          ${
            stock > 0
              ? `

                <div class="quantity-box">

                  <label>
                    Quantity
                  </label>

                  <div class="quantity-controls">

                    <button
                      type="button"
                      onclick="changeQuantity(-1)"
                    >
                      −
                    </button>

                    <input
                      type="number"
                      id="quantity"
                      value="1"
                      min="1"
                      max="${stock}"
                    >

                    <button
                      type="button"
                      onclick="changeQuantity(1)"
                    >
                      +
                    </button>

                  </div>

                </div>


                <div class="buttons">

                  <button
                    class="cart-btn"
                    onclick="addToCart()"
                  >
                    Add to Cart
                  </button>

                  <button
                    class="buy-btn"
                    onclick="buyNow()"
                  >
                    Buy Now
                  </button>

                </div>

              `
              : `
                <div class="buttons">

                  <button
                    class="buy-btn"
                    disabled
                  >
                    Out of Stock
                  </button>

                </div>
              `
          }

        </div>

      </div>

    `;

  }


  // ==========================================
  // CHANGE IMAGE
  // ==========================================

  function changeImage(image, thumbnail) {

    const mainImage =
      document.getElementById("mainImage");

    if (mainImage) {
      mainImage.src = image;
    }

    document
      .querySelectorAll(".gallery img")
      .forEach(img =>
        img.classList.remove("active")
      );

    thumbnail.classList.add("active");

  }


  // ==========================================
  // QUANTITY
  // ==========================================

  function changeQuantity(amount) {

    const input =
      document.getElementById("quantity");

    if (!input) return;

    let quantity =
      Number(input.value || 1);

    quantity += amount;

    const max =
      Number(input.max || 999);

    if (quantity < 1) {
      quantity = 1;
    }

    if (quantity > max) {
      quantity = max;
    }

    input.value = quantity;

  }


  // ==========================================
  // CART
  // ==========================================

  function getCart() {

    try {

      return JSON.parse(
        localStorage.getItem(
          "polandShopCart"
        )
      ) || [];

    } catch {

      return [];

    }

  }


  function saveCart(cart) {

    localStorage.setItem(
      "polandShopCart",
      JSON.stringify(cart)
    );

    updateCartCount();

  }


  function addToCart() {

    if (!product) return;

    const quantityInput =
      document.getElementById("quantity");

    const quantity =
      Number(
        quantityInput?.value || 1
      );

    const cart = getCart();

    const existing =
      cart.find(
        item =>
          item._id === product._id
      );

    const price =
      Number(
        product.discountPrice ??
        product.price ??
        0
      );

    if (existing) {

      existing.quantity += quantity;

    } else {

      cart.push({

        _id: product._id,

        name: product.name,

        price: price,

        image:
          product.images &&
          product.images.length
            ? product.images[0]
            : "",

        quantity: quantity

      });

    }

    saveCart(cart);

    alert(
      "Product added to your cart."
    );

  }


  // ==========================================
  // BUY NOW
  // ==========================================

  function buyNow() {

    if (!product) return;

    const quantityInput =
      document.getElementById("quantity");

    const quantity =
      Number(
        quantityInput?.value || 1
      );

    const cart = [];

    cart.push({

      _id: product._id,

      name: product.name,

      price:
        Number(
          product.discountPrice ??
          product.price ??
          0
        ),

      image:
        product.images &&
        product.images.length
          ? product.images[0]
          : "",

      quantity: quantity

    });

    localStorage.setItem(
      "polandShopCart",
      JSON.stringify(cart)
    );

    window.location.href =
      "cart.html";

  }


  // ==========================================
  // CART COUNT
  // ==========================================

  function updateCartCount() {

    const cart = getCart();

    const count =
      cart.reduce(
        (total, item) =>
          total +
          Number(item.quantity || 0),
        0
      );

    const element =
      document.getElementById(
        "cartCount"
      );

    if (element) {
      element.textContent = count;
    }

  }


  // ==========================================
  // SECURITY
  // ==========================================

  function escapeHtml(value) {

    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  function escapeJs(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;")
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "\\r");

  }


  // ==========================================
  // START
  // ==========================================

  updateCartCount();

  loadProduct();

</script></body>
</html>
