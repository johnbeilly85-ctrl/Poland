<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order - PolandShop</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 15px;
}

.header-inner {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

header a {
  color: white;
  text-decoration: none;
}

.container {
  max-width: 900px;
  margin: 25px auto;
  padding: 0 15px;
}

.box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

h1,
h2 {
  margin-bottom: 18px;
}

.product-summary {
  display: flex;
  gap: 15px;
  align-items: center;
}

.product-summary img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 8px;
  background: #eee;
}

.price {
  font-size: 22px;
  font-weight: bold;
  margin-top: 8px;
}

.field {
  margin-bottom: 14px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

input,
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
}

.total {
  font-size: 22px;
  font-weight: bold;
  margin-top: 15px;
}

.submit {
  width: 100%;
  padding: 14px;
  border: none;
  background: #e11d48;
  color: white;
  border-radius: 7px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.submit:disabled {
  background: #999;
}

.message {
  display: none;
  padding: 12px;
  border-radius: 7px;
  margin-bottom: 15px;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      PolandShop
    </div>

    <a href="index.html">
      Shop
    </a>

  </div>
</header>

<main class="container">

  <div
    id="message"
    class="message error"
  ></div>

  <section
    id="productBox"
    class="box"
  >
    Loading product...
  </section>

  <section class="box">

    <h2>
      Customer Information
    </h2>

    <form id="orderForm">

      <div class="field">
        <label>
          Full Name
        </label>

        <input
          id="fullName"
          required
          maxlength="200"
        >
      </div>

      <div class="field">
        <label>
          Phone Number
        </label>

        <input
          id="phone"
          type="tel"
          required
          maxlength="50"
        >
      </div>

      <div class="field">
        <label>
          Email Address
        </label>

        <input
          id="email"
          type="email"
          required
          maxlength="200"
        >
      </div>

      <div class="field">
        <label>
          Country
        </label>

        <input
          id="country"
          value="Poland"
          required
          maxlength="100"
        >
      </div>

      <div class="field">
        <label>
          City
        </label>

        <input
          id="city"
          required
          maxlength="100"
        >
      </div>

      <div class="field">
        <label>
          Delivery Address
        </label>

        <textarea
          id="address"
          required
          maxlength="500"
        ></textarea>
      </div>

      <div class="field">
        <label>
          Notes
        </label>

        <textarea
          id="notes"
          maxlength="1000"
        ></textarea>
      </div>

      <button
        id="submit"
        class="submit"
        type="submit"
      >
        Submit Order
      </button>

    </form>

  </section>

</main>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const productId =
  params.get("id");

let product = null;

let quantity =
  Number(
    params.get("quantity")
  ) || 1;

function $(id) {
  return document.getElementById(id);
}

function money(value) {
  return "PLN " +
    Number(value).toFixed(2);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(character) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character];
      }
    );
}

function getPrice(product) {

  const price =
    Number(product.price);

  const discount =
    Number(product.discountPrice);

  if (
    Number.isFinite(discount) &&
    discount > 0 &&
    discount < price
  ) {
    return discount;
  }

  return price;
}

async function loadProduct() {

  if (!productId) {

    $("productBox").textContent =
      "Product ID is missing.";

    $("submit").disabled =
      true;

    return;
  }

  try {

    const response =
      await fetch(
        "/api/products/" +
        encodeURIComponent(
          productId
        )
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.message ||
        "Product not found."
      );
    }

    product = data;

    const stock =
      Number(product.stock);

    if (
      stock < 1
    ) {

      $("productBox").innerHTML =
        "<h2>Product is out of stock.</h2>";

      $("submit").disabled =
        true;

      return;
    }

    quantity =
      Math.max(
        1,
        Math.min(
          stock,
          quantity
        )
      );

    const price =
      getPrice(product);

    $("productBox").innerHTML = `

      <h1>
        Order Product
      </h1>

      <div class="product-summary">

        <img
          src="${
            escapeHtml(
              product.images?.[0] ||
              "https://via.placeholder.com/200x200?text=Product"
            )
          }"
          alt="${escapeHtml(product.name)}"
        >

        <div>

          <h2>
            ${escapeHtml(product.name)}
          </h2>

          <div>
            Quantity:
            ${quantity}
          </div>

          <div class="price">
            ${money(price)}
          </div>

        </div>

      </div>

      <div class="total">
        Total:
        ${money(price * quantity)}
      </div>
    `;

  } catch (error) {

    $("productBox").textContent =
      error.message;

    $("submit").disabled =
      true;
  }
}

$("orderForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      if (!product) {
        return;
      }

      const button =
        $("submit");

      const message =
        $("message");

      message.style.display =
        "none";

      button.disabled =
        true;

      button.textContent =
        "Submitting...";

      const payload = {

        customer: {

          fullName:
            $("fullName").value.trim(),

          phone:
            $("phone").value.trim(),

          email:
            $("email").value.trim(),

          country:
            $("country").value.trim(),

          city:
            $("city").value.trim(),

          address:
            $("address").value.trim(),

          notes:
            $("notes").value.trim()

        },

        items: [
          {
            productId:
              String(product._id),

            quantity
          }
        ],

        paymentMethod:
          "Skrill"

      };

      try {

        const response =
          await fetch(
            "/api/orders",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  payload
                )
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            "Unable to submit order."
          );
        }

        if (data.order) {

          localStorage.setItem(
            "lastOrder",
            JSON.stringify(
              data.order
            )
          );

        }

        window.location.href =
          "success.html?orderId=" +
          encodeURIComponent(
            data.orderId
          );

      } catch (error) {

        message.textContent =
          error.message;

        message.style.display =
          "block";

        button.disabled =
          false;

        button.textContent =
          "Submit Order";
      }

    }
  );

loadProduct();

</script>

</body>
</html>
