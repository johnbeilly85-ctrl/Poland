<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart - PolandShop</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 15px;
}

.header-inner {
  max-width: 1000px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

header a {
  color: white;
  text-decoration: none;
}

.container {
  max-width: 1000px;
  margin: 25px auto;
  padding: 0 15px;
}

h1 {
  margin-bottom: 20px;
}

.cart-item {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: 90px 1fr auto;
  gap: 15px;
  align-items: center;
}

.cart-item img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 7px;
  background: #eee;
}

.name {
  font-weight: bold;
  margin-bottom: 7px;
}

.price {
  color: #444;
}

.controls {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 10px;
}

.controls button {
  width: 32px;
  height: 32px;
  border: none;
  background: #ddd;
  border-radius: 5px;
  cursor: pointer;
}

.quantity {
  min-width: 30px;
  text-align: center;
}

.remove {
  color: #c00;
  background: none !important;
  width: auto !important;
  padding: 0 5px;
}

.line-total {
  font-weight: bold;
  white-space: nowrap;
}

.summary {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-top: 20px;
}

.total {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 15px;
}

.checkout {
  display: block;
  width: 100%;
  background: #e11d48;
  color: white;
  text-align: center;
  text-decoration: none;
  padding: 13px;
  border-radius: 7px;
  font-weight: bold;
}

.continue {
  display: block;
  text-align: center;
  margin-top: 12px;
  color: #111;
}

.empty {
  background: white;
  padding: 45px 20px;
  text-align: center;
  border-radius: 10px;
}

@media (max-width: 600px) {
  .cart-item {
    grid-template-columns: 70px 1fr;
  }

  .cart-item img {
    width: 70px;
    height: 70px;
  }

  .line-total {
    grid-column: 2;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      PolandShop
    </div>

    <a href="index.html">
      Continue Shopping
    </a>

  </div>
</header>

<main class="container">

  <h1>
    Your Shopping Cart
  </h1>

  <div id="cartItems"></div>

  <div
    id="summary"
    class="summary"
    style="display:none;"
  >

    <div class="total">
      Total:
      <span id="total">PLN 0.00</span>
    </div>

    <a
      href="checkout.html"
      class="checkout"
    >
      Proceed to Checkout
    </a>

    <a
      href="index.html"
      class="continue"
    >
      Continue Shopping
    </a>

  </div>

</main>

<script>

const CART_KEY =
  "polandShopCart";

function $(id) {
  return document.getElementById(id);
}

function money(value) {
  return "PLN " +
    Number(value).toFixed(2);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(character) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character];
      }
    );
}

function getCart() {

  try {

    return JSON.parse(
      localStorage.getItem(
        CART_KEY
      )
    ) || [];

  } catch {

    return [];

  }
}

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );
}

function renderCart() {

  const cart =
    getCart();

  if (!cart.length) {

    $("cartItems").innerHTML = `
      <div class="empty">

        <h2>
          Your cart is empty
        </h2>

        <p style="margin:10px 0 20px;">
          Add some products to your cart.
        </p>

        <a href="index.html">
          Start Shopping
        </a>

      </div>
    `;

    $("summary").style.display =
      "none";

    return;
  }

  let total = 0;

  $("cartItems").innerHTML =
    cart.map(
      function(item, index) {

        const price =
          Number(item.price) || 0;

        const quantity =
          Number(item.quantity) || 1;

        const lineTotal =
          price * quantity;

        total += lineTotal;

        const image =
          item.image ||
          "https://via.placeholder.com/200x200?text=Product";

        return `
          <div class="cart-item">

            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(item.name)}"
            >

            <div>

              <div class="name">
                ${escapeHtml(item.name)}
              </div>

              <div class="price">
                ${money(price)} each
              </div>

              <div class="controls">

                <button
                  data-action="minus"
                  data-index="${index}"
                >
                  −
                </button>

                <span class="quantity">
                  ${quantity}
                </span>

                <button
                  data-action="plus"
                  data-index="${index}"
                >
                  +
                </button>

                <button
                  class="remove"
                  data-action="remove"
                  data-index="${index}"
                >
                  Remove
                </button>

              </div>

            </div>

            <div class="line-total">
              ${money(lineTotal)}
            </div>

          </div>
        `;

      }
    )
    .join("");

  $("total").textContent =
    money(total);

  $("summary").style.display =
    "block";

  document
    .querySelectorAll(
      "[data-action]"
    )
    .forEach(
      function(button) {

        button.onclick =
          function() {

            const index =
              Number(
                button.dataset.index
              );

            const action =
              button.dataset.action;

            updateItem(
              index,
              action
            );

          };

      }
    );
}

function updateItem(
  index,
  action
) {

  const cart =
    getCart();

  if (!cart[index]) return;

  if (
    action === "plus"
  ) {

    cart[index].quantity =
      Number(
        cart[index].quantity
      ) + 1;

  } else if (
    action === "minus"
  ) {

    cart[index].quantity =
      Number(
        cart[index].quantity
      ) - 1;

    if (
      cart[index].quantity < 1
    ) {
      cart.splice(
        index,
        1
      );
    }

  } else if (
    action === "remove"
  ) {

    cart.splice(
      index,
      1
    );
  }

  saveCart(cart);

  renderCart();
}

renderCart();

</script>

</body>
</html>
