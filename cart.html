<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - PolandShop</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .cart-box {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .cart-box h2 {
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
      align-items: center;
    }

    .cart-item img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .item-info {
      flex: 1;
    }

    .item-info h3 {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: none;
      background: #111;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 18px;
    }

    .quantity span {
      min-width: 25px;
      text-align: center;
      font-weight: bold;
    }

    .remove {
      border: none;
      background: #dc2626;
      color: white;
      padding: 8px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .summary {
      margin-top: 25px;
      border-top: 2px solid #ddd;
      padding-top: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
    }

    .checkout-btn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #15803d;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #666;
    }

    .shop-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 18px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      .cart-item {
        align-items: flex-start;
      }

      .cart-item img {
        width: 75px;
        height: 75px;
      }

      .remove {
        font-size: 12px;
      }
    }
  </style></head><body><header>
  <h1>PolandShop</h1>
  <a href="products.html">Continue Shopping</a>
</header><div class="container">  <div class="cart-box">
    <h2>Your Shopping Cart</h2><div id="cartItems"></div>

<div id="emptyCart" class="empty" style="display:none;">
  <p>Your cart is empty.</p>
  <a href="products.html" class="shop-btn">Continue Shopping</a>
</div>

<div id="cartSummary" class="summary" style="display:none;">

  <div class="summary-row">
    <span>Subtotal</span>
    <span id="subtotal">$0.00</span>
  </div>

  <div class="summary-row">
    <span>Delivery</span>
    <span>Calculated at checkout</span>
  </div>

  <div class="summary-row total">
    <span>Total</span>
    <span id="total">$0.00</span>
  </div>

  <button class="checkout-btn" onclick="checkout()">
    Proceed to Checkout
  </button>

</div>

  </div></div><script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  function formatPrice(price) {
    return "$" + Number(price).toFixed(2);
  }

  function renderCart() {
    const cartItems = document.getElementById("cartItems");
    const emptyCart = document.getElementById("emptyCart");
    const cartSummary = document.getElementById("cartSummary");

    cartItems.innerHTML = "";

    if (cart.length === 0) {
      emptyCart.style.display = "block";
      cartSummary.style.display = "none";
      return;
    }

    emptyCart.style.display = "none";
    cartSummary.style.display = "block";

    let subtotal = 0;

    cart.forEach((item, index) => {

      const price = Number(item.price) || 0;
      const quantity = Number(item.quantity) || 1;

      subtotal += price * quantity;

      const div = document.createElement("div");
      div.className = "cart-item";

      div.innerHTML = `
        <img src="${item.image || 'https://via.placeholder.com/90'}"
             alt="${escapeHtml(item.name || 'Product')}">

        <div class="item-info">
          <h3>${escapeHtml(item.name || 'Product')}</h3>

          <div class="price">
            ${formatPrice(price)}
          </div>

          <div class="quantity">
            <button onclick="changeQuantity(${index}, -1)">−</button>

            <span>${quantity}</span>

            <button onclick="changeQuantity(${index}, 1)">+</button>
          </div>
        </div>

        <button class="remove" onclick="removeItem(${index})">
          Remove
        </button>
      `;

      cartItems.appendChild(div);
    });

    document.getElementById("subtotal").textContent =
      formatPrice(subtotal);

    document.getElementById("total").textContent =
      formatPrice(subtotal);
  }

  function changeQuantity(index, change) {

    if (!cart[index]) return;

    cart[index].quantity =
      (Number(cart[index].quantity) || 1) + change;

    if (cart[index].quantity <= 0) {
      cart.splice(index, 1);
    }

    saveCart();
    renderCart();
  }

  function removeItem(index) {

    cart.splice(index, 1);

    saveCart();
    renderCart();
  }

  function checkout() {

    if (cart.length === 0) {
      alert("Your cart is empty.");
      return;
    }

    window.location.href = "checkout.html";
  }

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  renderCart();
</script></body>
</html>
