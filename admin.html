<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PolandShop Admin</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 16px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.logout {
  background: #dc2626;
  color: white;
  border: none;
  padding: 9px 14px;
  border-radius: 6px;
  cursor: pointer;
}

.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

.box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

h1,
h2 {
  margin-bottom: 18px;
}

.field {
  margin-bottom: 13px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  cursor: pointer;
}

.primary {
  background: #111;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 7px;
  font-weight: bold;
}

.danger {
  background: #dc2626;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
}

.success {
  background: #16a34a;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
}

.secondary {
  background: #ddd;
  color: #222;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
}

.login {
  max-width: 450px;
  margin: 80px auto;
  padding: 0 15px;
}

.message {
  padding: 12px;
  border-radius: 7px;
  margin-bottom: 15px;
  display: none;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.ok {
  background: #dcfce7;
  color: #166534;
}

.product-row,
.order-row {
  border: 1px solid #ddd;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.product-row {
  display: flex;
  gap: 15px;
  align-items: center;
}

.product-row img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 6px;
  background: #eee;
}

.product-info {
  flex: 1;
}

.product-name {
  font-weight: bold;
  margin-bottom: 5px;
}

.order-row {
  background: #fafafa;
}

.order-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.order-reference {
  font-weight: bold;
  font-size: 18px;
}

.status {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 20px;
  background: #e5e7eb;
  font-size: 12px;
}

.order-details {
  line-height: 1.6;
  color: #444;
}

.order-items {
  margin: 10px 0;
  padding: 10px;
  background: white;
  border-radius: 6px;
}

.order-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.hidden {
  display: none !important;
}

@media (max-width: 650px) {
  .product-row {
    align-items: flex-start;
  }

  .product-row img {
    width: 65px;
    height: 65px;
  }

  .order-header {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div id="loginPage" class="login">

  <div class="box">

    <h1>
      PolandShop Admin
    </h1>

    <p style="margin-bottom:15px;">
      Enter your admin token to continue.
    </p>

    <div
      id="loginMessage"
      class="message error"
    ></div>

    <div class="field">

      <label>
        Admin Token
      </label>

      <input
        id="token"
        type="password"
        autocomplete="off"
        placeholder="Enter ADMIN_TOKEN"
      >

    </div>

    <button
      id="loginButton"
      class="primary"
      style="width:100%;"
    >
      Login
    </button>

  </div>

</div>

<div
  id="adminPage"
  class="hidden"
>

<header>

  <div class="header-inner">

    <div class="logo">
      PolandShop Admin
    </div>

    <button
      id="logout"
      class="logout"
    >
      Logout
    </button>

  </div>

</header>

<main class="container">

  <div
    id="message"
    class="message"
  ></div>

  <section class="box">

    <h2>
      Add Product
    </h2>

    <form id="productForm">

      <div class="field">

        <label>
          Product Name
        </label>

        <input
          id="name"
          name="name"
          required
          maxlength="200"
        >

      </div>

      <div class="field">

        <label>
          Description
        </label>

        <textarea
          id="description"
          name="description"
          maxlength="3000"
        ></textarea>

      </div>

      <div class="field">

        <label>
          Category
        </label>

        <select
          id="category"
          name="category"
        >

          <option>
            Electronics
          </option>

          <option>
            Home
          </option>

          <option>
            Fashion
          </option>

          <option>
            Beauty
          </option>

          <option>
            Sports
          </option>

          <option>
            Other
          </option>

        </select>

      </div>

      <div class="field">

        <label>
          Stock
        </label>

        <input
          id="stock"
          name="stock"
          type="number"
          min="0"
          step="1"
          value="1"
          required
        >

      </div>

      <div class="field">

        <label>
          Price (PLN)
        </label>

        <input
          id="price"
          name="price"
          type="number"
          min="0.01"
          step="0.01"
          required
        >

      </div>

      <div class="field">

        <label>
          Discount Price (PLN) - Optional
        </label>

        <input
          id="discountPrice"
          name="discountPrice"
          type="number"
          min="0.01"
          step="0.01"
        >

      </div>

      <div class="field">

        <label>
          Product Images
          (Maximum 10)
        </label>

        <input
          id="images"
          name="images"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
          multiple
        >

      </div>

      <button
        id="addButton"
        class="primary"
        type="submit"
      >
        Add Product
      </button>

    </form>

  </section>

  <section class="box">

    <h2>
      Products
    </h2>

    <div id="products">
      Loading products...
    </div>

  </section>

  <section class="box">

    <h2>
      Orders
    </h2>

    <div id="orders">
      Loading orders...
    </div>

  </section>

</main>

</div>

<script>

const TOKEN_KEY =
  "polandShopAdminToken";

let token =
  sessionStorage.getItem(
    TOKEN_KEY
  ) || "";

function $(id) {
  return document.getElementById(id);
}

function money(value) {
  return "PLN " +
    Number(value).toFixed(2);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(character) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character];
      }
    );
}

function showMessage(
  message,
  type = "ok"
) {

  const box =
    $("message");

  box.textContent =
    message;

  box.className =
    "message " + type;

  box.style.display =
    "block";
}

function showLoginError(
  message
) {

  const box =
    $("loginMessage");

  box.textContent =
    message;

  box.style.display =
    "block";
}

async function api(
  url,
  options = {}
) {

  const headers =
    {
      ...(options.headers || {}),
      Authorization:
        "Bearer " + token
    };

  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );

  let data = null;

  try {
    data =
      await response.json();
  } catch {
    data = {};
  }

  if (
    response.status === 401
  ) {

    sessionStorage.removeItem(
      TOKEN_KEY
    );

    token = "";

    showLogin();

    throw new Error(
      "Admin session expired."
    );
  }

  if (!response.ok) {

    throw new Error(
      data.message ||
      "Request failed."
    );

  }

  return data;
}

function showAdmin() {

  $("loginPage")
    .classList.add(
      "hidden"
    );

  $("adminPage")
    .classList.remove(
      "hidden"
    );

  loadProducts();
  loadOrders();
}

function showLogin() {

  $("adminPage")
    .classList.add(
      "hidden"
    );

  $("loginPage")
    .classList.remove(
      "hidden"
    );
}

async function login() {

  const entered =
    $("token").value.trim();

  if (!entered) {

    showLoginError(
      "Enter the admin token."
    );

    return;
  }

  token =
    entered;

  sessionStorage.setItem(
    TOKEN_KEY,
    token
  );

  try {

    await api(
      "/api/admin/products"
    );

    showAdmin();

  } catch (error) {

    token = "";

    sessionStorage.removeItem(
      TOKEN_KEY
    );

    showLoginError(
      error.message
    );
  }
}

$("loginButton")
  .addEventListener(
    "click",
    login
  );

$("token")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {
        login();
      }

    }
  );

$("logout")
  .addEventListener(
    "click",
    function() {

      sessionStorage.removeItem(
        TOKEN_KEY
      );

      token = "";

      showLogin();

    }
  );

/* =====================================================
   ADD PRODUCT
===================================================== */

$("productForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const button =
        $("addButton");

      button.disabled =
        true;

      button.textContent =
        "Adding Product...";

      try {

        const formData =
          new FormData();

        formData.append(
          "name",
          $("name").value.trim()
        );

        formData.append(
          "description",
          $("description").value.trim()
        );

        formData.append(
          "category",
          $("category").value
        );

        formData.append(
          "stock",
          $("stock").value
        );

        formData.append(
          "price",
          $("price").value
        );

        if (
          $("discountPrice").value
        ) {

          formData.append(
            "discountPrice",
            $("discountPrice").value
          );

        }

        const files =
          $("images").files;

        for (
          let i = 0;
          i < files.length;
          i++
        ) {

          formData.append(
            "images",
            files[i]
          );

        }

        const data =
          await api(
            "/api/admin/products",
            {
              method: "POST",
              body: formData
            }
          );

        showMessage(
          data.message ||
          "Product added."
        );

        $("productForm").reset();

        loadProducts();

      } catch (error) {

        showMessage(
          error.message,
          "error"
        );

      } finally {

        button.disabled =
          false;

        button.textContent =
          "Add Product";

      }

    }
  );

/* =====================================================
   PRODUCTS
===================================================== */

async function loadProducts() {

  try {

    const products =
      await api(
        "/api/admin/products"
      );

    if (!products.length) {

      $("products").innerHTML =
        "<p>No products added yet.</p>";

      return;
    }

    $("products").innerHTML =
      products.map(
        function(product) {

          const image =
            product.images?.[0] ||
            "https://via.placeholder.com/100x100?text=Product";

          const price =
            Number(
              product.discountPrice &&
              product.discountPrice <
                product.price
                ? product.discountPrice
                : product.price
            );

          return `

            <div class="product-row">

              <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(product.name)}"
              >

              <div class="product-info">

                <div class="product-name">
                  ${escapeHtml(product.name)}
                </div>

                <div>
                  ${money(price)}
                </div>

                <div>
                  Category:
                  ${escapeHtml(product.category)}
                </div>

                <div>
                  Stock:
                  ${Number(product.stock)}
                </div>

              </div>

              <button
                class="danger"
                data-delete-product="${escapeHtml(product._id)}"
              >
                Delete
              </button>

            </div>

          `;

        }
      ).join("");

    document
      .querySelectorAll(
        "[data-delete-product]"
      )
      .forEach(
        function(button) {

          button.onclick =
            function() {

              deleteProduct(
                button.dataset.deleteProduct
              );

            };

        }
      );

  } catch (error) {

    $("products").innerHTML =
      `<p>${escapeHtml(error.message)}</p>`;

  }
}

async function deleteProduct(
  productId
) {

  if (
    !confirm(
      "Delete this product?"
    )
  ) {
    return;
  }

  try {

    const data =
      await api(
        "/api/admin/products/" +
        encodeURIComponent(
          productId
        ),
        {
          method: "DELETE"
        }
      );

    showMessage(
      data.message
    );

    loadProducts();

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );

  }
}

/* =====================================================
   ORDERS
===================================================== */

async function loadOrders() {

  try {

    const orders =
      await api(
        "/api/admin/orders"
      );

    if (!orders.length) {

      $("orders").innerHTML =
        "<p>No orders yet.</p>";

      return;
    }

    $("orders").innerHTML =
      orders.map(
        function(order) {

          const customer =
            order.customer ||
            {};

          const items =
            Array.isArray(
              order.items
            )
              ? order.items
              : [];

          return `

            <div class="order-row">

              <div class="order-header">

                <div>

                  <div class="order-reference">

                    ${escapeHtml(
                      order.orderReference ||
                      order._id
                    )}

                  </div>

                  <div>
                    ${
                      order.createdAt
                        ? new Date(
                            order.createdAt
                          ).toLocaleString()
                        : ""
                    }
                  </div>

                </div>

                <div>

                  <span class="status">
                    Payment:
                    ${escapeHtml(
                      order.paymentStatus ||
                      "pending"
                    )}
                  </span>

                  <span class="status">
                    Order:
                    ${escapeHtml(
                      order.orderStatus ||
                      "pending"
                    )}
                  </span>

                </div>

              </div>

              <div class="order-details">

                <strong>
                  Customer
                </strong>

                <br>

                ${escapeHtml(
                  customer.fullName
                )}

                <br>

                Phone:
                ${escapeHtml(
                  customer.phone
                )}

                <br>

                Email:
                ${escapeHtml(
                  customer.email
                )}

                <br>

                Address:
                ${escapeHtml(
                  customer.address
                )}

              </div>

              <div class="order-items">

                <strong>
                  Items
                </strong>

                ${
                  items.map(
                    function(item) {

                      return `
                        <div style="margin-top:7px;">

                          ${escapeHtml(
                            item.name
                          )}

                          ×
                          ${Number(
                            item.quantity
                          )}

                          —
                          ${money(
                            item.lineTotal
                          )}

                        </div>
                      `;

                    }
                  ).join("")
                }

              </div>

              <strong>
                Total:
                ${money(
                  order.total
                )}
              </strong>

              <div
                class="order-actions"
              >

                ${
                  order.paymentStatus !==
                  "paid"
                    ? `
                      <button
                        class="success"
                        data-pay="${escapeHtml(order._id)}"
                      >
                        Confirm Payment
                      </button>

                      <button
                        class="danger"
                        data-reject="${escapeHtml(order._id)}"
                      >
                        Reject Payment
                      </button>
                    `
                    : ""
                }

                ${
                  order.paymentStatus ===
                  "paid"
                    ? `
                      <button
                        class="secondary"
                        data-status="${escapeHtml(order._id)}"
                        data-new-status="shipped"
                      >
                        Mark Shipped
                      </button>

                      <button
                        class="secondary"
                        data-status="${escapeHtml(order._id)}"
                        data-new-status="out_for_delivery"
                      >
                        Out for Delivery
                      </button>

                      <button
                        class="secondary"
                        data-status="${escapeHtml(order._id)}"
                        data-new-status="delivered"
                      >
                        Delivered
                      </button>
                    `
                    : ""
                }

              </div>

            </div>

          `;

        }
      ).join("");

    document
      .querySelectorAll(
        "[data-pay]"
      )
      .forEach(
        function(button) {

          button.onclick =
            function() {

              confirmPayment(
                button.dataset.pay
              );

            };

        }
      );

    document
      .querySelectorAll(
        "[data-reject]"
      )
      .forEach(
        function(button) {

          button.onclick =
            function() {

              rejectPayment(
                button.dataset.reject
              );

            };

        }
      );

    document
      .querySelectorAll(
        "[data-status]"
      )
      .forEach(
        function(button) {

          button.onclick =
            function() {

              updateStatus(
                button.dataset.status,
                button.dataset.newStatus
              );

            };

        }
      );

  } catch (error) {

    $("orders").innerHTML =
      `<p>${escapeHtml(error.message)}</p>`;

  }
}

async function confirmPayment(
  orderId
) {

  const reference =
    prompt(
      "Enter the Skrill payment reference if available:"
    );

  if (
    reference === null
  ) {
    return;
  }

  try {

    const data =
      await api(
        "/api/admin/orders/" +
        encodeURIComponent(
          orderId
        ) +
        "/payment",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              status: "paid",

              paymentReference:
                reference.trim()
            })
        }
      );

    showMessage(
      data.message
    );

    loadOrders();
    loadProducts();

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );

  }
}

async function rejectPayment(
  orderId
) {

  if (
    !confirm(
      "Mark this payment as rejected?"
    )
  ) {
    return;
  }

  try {

    const data =
      await api(
        "/api/admin/orders/" +
        encodeURIComponent(
          orderId
        ) +
        "/payment",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              status: "rejected"
            })
        }
      );

    showMessage(
      data.message
    );

    loadOrders();

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );

  }
}

async function updateStatus(
  orderId,
  status
) {

  try {

    const data =
      await api(
        "/api/admin/orders/" +
        encodeURIComponent(
          orderId
        ) +
        "/status",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              status
            })
        }
      );

    showMessage(
      data.message
    );

    loadOrders();

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );

  }
}

/* =====================================================
   START
===================================================== */

if (token) {

  api(
    "/api/admin/products"
  )
    .then(
      function() {
        showAdmin();
      }
    )
    .catch(
      function() {
        showLogin();
      }
    );

} else {

  showLogin();

}

</script>

</body>
</html>
