<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - PolandShop</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 15px;
}

.header-inner {
  max-width: 1050px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

header a {
  color: white;
  text-decoration: none;
}

.container {
  max-width: 1050px;
  margin: 25px auto;
  padding: 0 15px;
}

.layout {
  display: grid;
  grid-template-columns: 1.3fr .7fr;
  gap: 20px;
}

.box {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

h1,
h2 {
  margin-bottom: 18px;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
}

.field input,
.field textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}

.field textarea {
  min-height: 90px;
  resize: vertical;
}

.payment {
  background: #fff7ed;
  border: 1px solid #fdba74;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 18px;
}

.payment strong {
  display: block;
  margin-bottom: 6px;
}

.skrill {
  font-size: 18px;
  font-weight: bold;
  word-break: break-word;
}

.item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.item-name {
  font-weight: bold;
}

.item-small {
  color: #666;
  font-size: 13px;
  margin-top: 4px;
}

.total {
  display: flex;
  justify-content: space-between;
  margin-top: 18px;
  font-size: 22px;
  font-weight: bold;
}

.submit {
  width: 100%;
  border: none;
  background: #e11d48;
  color: white;
  padding: 14px;
  border-radius: 7px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 18px;
}

.submit:disabled {
  background: #999;
  cursor: not-allowed;
}

.message {
  padding: 12px;
  border-radius: 7px;
  margin-bottom: 15px;
  display: none;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

@media (max-width: 750px) {
  .layout {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      PolandShop
    </div>

    <a href="cart.html">
      Back to Cart
    </a>

  </div>
</header>

<main class="container">

  <div
    id="message"
    class="message error"
  ></div>

  <div class="layout">

    <section class="box">

      <h1>
        Checkout
      </h1>

      <div class="payment">

        <strong>
          Manual Skrill Payment
        </strong>

        <p>
          After submitting your order,
          send your payment through Skrill to:
        </p>

        <div class="skrill">
          cynthiakp4465@gmail.com
        </div>

        <p style="margin-top:8px;">
          Your order will remain pending
          until payment is confirmed.
        </p>

      </div>

      <form id="checkoutForm">

        <div class="field">
          <label for="fullName">
            Full Name
          </label>

          <input
            id="fullName"
            required
            maxlength="200"
          >
        </div>

        <div class="field">
          <label for="phone">
            Phone Number
          </label>

          <input
            id="phone"
            type="tel"
            required
            maxlength="50"
          >
        </div>

        <div class="field">
          <label for="email">
            Email Address
          </label>

          <input
            id="email"
            type="email"
            required
            maxlength="200"
          >
        </div>

        <div class="field">
          <label for="country">
            Country
          </label>

          <input
            id="country"
            value="Poland"
            required
            maxlength="100"
          >
        </div>

        <div class="field">
          <label for="city">
            City
          </label>

          <input
            id="city"
            required
            maxlength="100"
          >
        </div>

        <div class="field">
          <label for="address">
            Delivery Address
          </label>

          <textarea
            id="address"
            required
            maxlength="500"
          ></textarea>
        </div>

        <div class="field">
          <label for="notes">
            Order Notes
            (Optional)
          </label>

          <textarea
            id="notes"
            maxlength="1000"
          ></textarea>
        </div>

        <button
          id="submitButton"
          class="submit"
          type="submit"
        >
          Submit Order
        </button>

      </form>

    </section>

    <aside class="box">

      <h2>
        Order Summary
      </h2>

      <div id="items"></div>

      <div class="total">

        <span>
          Total
        </span>

        <span id="total">
          PLN 0.00
        </span>

      </div>

    </aside>

  </div>

</main>

<script>

const CART_KEY =
  "polandShopCart";

function $(id) {
  return document.getElementById(id);
}

function money(value) {
  return "PLN " +
    Number(value).toFixed(2);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(character) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[character];
      }
    );
}

function getCart() {

  try {

    return JSON.parse(
      localStorage.getItem(
        CART_KEY
      )
    ) || [];

  } catch {

    return [];

  }
}

const cart =
  getCart();

if (!cart.length) {

  $("message").textContent =
    "Your cart is empty. Please add a product before checkout.";

  $("message").style.display =
    "block";

  $("submitButton").disabled =
    true;
}

function renderSummary() {

  let total = 0;

  $("items").innerHTML =
    cart.map(
      function(item) {

        const price =
          Number(item.price) || 0;

        const quantity =
          Number(item.quantity) || 1;

        const lineTotal =
          price * quantity;

        total += lineTotal;

        return `
          <div class="item">

            <div>

              <div class="item-name">
                ${escapeHtml(item.name)}
              </div>

              <div class="item-small">
                ${quantity} × ${money(price)}
              </div>

            </div>

            <strong>
              ${money(lineTotal)}
            </strong>

          </div>
        `;

      }
    ).join("");

  $("total").textContent =
    money(total);
}

renderSummary();

$("checkoutForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      if (!cart.length) {
        return;
      }

      const button =
        $("submitButton");

      const message =
        $("message");

      message.style.display =
        "none";

      button.disabled =
        true;

      button.textContent =
        "Submitting Order...";

      const payload = {

        customer: {

          fullName:
            $("fullName").value.trim(),

          phone:
            $("phone").value.trim(),

          email:
            $("email").value.trim(),

          country:
            $("country").value.trim(),

          city:
            $("city").value.trim(),

          address:
            $("address").value.trim(),

          notes:
            $("notes").value.trim()

        },

        items:
          cart.map(
            function(item) {

              return {
                productId:
                  String(
                    item.productId
                  ),

                quantity:
                  Number(
                    item.quantity
                  )
              };

            }
          ),

        paymentMethod:
          "Skrill"

      };

      try {

        const response =
          await fetch(
            "/api/orders",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  payload
                )
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            "Unable to submit order."
          );
        }

        if (
          data.order
        ) {

          localStorage.setItem(
            "lastOrder",
            JSON.stringify(
              data.order
            )
          );

        }

        localStorage.removeItem(
          CART_KEY
        );

        window.location.href =
          "success.html?orderId=" +
          encodeURIComponent(
            data.orderId
          );

      } catch (error) {

        message.textContent =
          error.message;

        message.style.display =
          "block";

        button.disabled =
          false;

        button.textContent =
          "Submit Order";

      }

    }
  );

</script>

</body>
</html>
