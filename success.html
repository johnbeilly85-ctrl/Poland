<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Received - PolandShop</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 15px;
}

.header-inner {
  max-width: 800px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

header a {
  color: white;
  text-decoration: none;
}

.container {
  max-width: 700px;
  margin: 50px auto;
  padding: 0 15px;
}

.box {
  background: white;
  padding: 35px 25px;
  border-radius: 12px;
  text-align: center;
}

.check {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #dcfce7;
  color: #166534;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto 20px;
  font-size: 35px;
  font-weight: bold;
}

h1 {
  margin-bottom: 12px;
}

.reference {
  margin: 20px 0;
  padding: 15px;
  background: #f5f5f5;
  border-radius: 8px;
}

.reference strong {
  display: block;
  margin-top: 5px;
  font-size: 20px;
}

.payment {
  margin-top: 20px;
  padding: 18px;
  background: #fff7ed;
  border: 1px solid #fdba74;
  border-radius: 8px;
}

.skrill {
  font-size: 18px;
  font-weight: bold;
  margin-top: 8px;
  word-break: break-word;
}

.total {
  margin-top: 15px;
  font-size: 19px;
  font-weight: bold;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

.buttons a {
  flex: 1;
  padding: 13px;
  border-radius: 7px;
  text-decoration: none;
  font-weight: bold;
}

.home {
  background: #111;
  color: white;
}

.shop {
  background: #e11d48;
  color: white;
}

@media (max-width: 500px) {
  .buttons {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      PolandShop
    </div>

    <a href="index.html">
      Shop
    </a>

  </div>
</header>

<main class="container">

  <section class="box">

    <div class="check">
      ✓
    </div>

    <h1>
      Order Received!
    </h1>

    <p>
      Your order has been submitted successfully.
    </p>

    <div class="reference">

      Order Reference:

      <strong id="orderReference">
        Loading...
      </strong>

    </div>

    <div
      id="total"
      class="total"
    ></div>

    <div class="payment">

      <strong>
        Skrill Payment
      </strong>

      <p style="margin-top:8px;">
        Please send your payment through Skrill to:
      </p>

      <div class="skrill">
        cynthiakp4465@gmail.com
      </div>

      <p style="margin-top:10px;">
        Your order will remain pending
        until payment has been confirmed.
      </p>

    </div>

    <div class="buttons">

      <a
        href="index.html"
        class="home"
      >
        Home
      </a>

      <a
        href="index.html"
        class="shop"
      >
        Continue Shopping
      </a>

    </div>

  </section>

</main>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const referenceFromUrl =
  params.get("orderId");

let savedOrder = null;

try {

  savedOrder =
    JSON.parse(
      localStorage.getItem(
        "lastOrder"
      )
    );

} catch {

  savedOrder = null;

}

const orderReference =
  referenceFromUrl ||
  (
    savedOrder &&
    (
      savedOrder.orderReference ||
      savedOrder._id
    )
  ) ||
  "Order received";

document
  .getElementById(
    "orderReference"
  )
  .textContent =
  orderReference;

if (
  savedOrder &&
  savedOrder.total !== undefined
) {

  document
    .getElementById(
      "total"
    )
    .textContent =
    "Order Total: PLN " +
    Number(
      savedOrder.total
    ).toFixed(2);

}

</script>

</body>
</html>
